name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# cancels the older push is a new push to the same pr is run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    env:
      # fake values
      # db is a burner container
      # ascend api is never called
      JWT_SECRET_KEY: OhHQpxR7jbddQrU5tEX6H3eXf240JdixAQxXYlEWKvY=
      RAPIDAPI_KEY: not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Surefire unit test and Failsafe db teste
      # Docker is installed in the runner
      - name: Verify
        run: ./mvnw -B clean verify
      - name: Keep the jar that passed
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Backend/target/*.jar
          if-no-files-found: error
          retention-days: 7
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api-smoke:
    name: API smoke (Newman)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: progress_tracker
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      RDS_HOSTNAME: 127.0.0.1
      RDS_PORT: "3306"
      RDS_DB_NAME: progress_tracker
      RDS_USERNAME: root
      RDS_PASSWORD: ci-root-password
      JWT_SECRET_KEY: OhHQpxR7jbddQrU5tEX6H3eXf240JdixAQxXYlEWKvY=
      RAPIDAPI_KEY: not-a-real-key
      # All ExerciseDB calls go to the WireMock container, never to RapidAPI.
      RAPIDAPI_EXERCISEDB_BASE_URL: http://localhost:8089/api/v1
      # Real migrations from the jar, then the CI-only exercises from the checkout.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:${{ github.workspace }}/Backend/ci-seed
      # The app creates this admin at start-up (AdminBootstrap) and the Newman runner logs in with it.
      # Throwaway values for a throwaway database; nothing real is protected here.
      ADMIN_EMAIL: admin@ci.test
      ADMIN_PW: ci-admin-password
      TEST_USER_EMAIL: user@ci.test
      TEST_USER_PW: ci-user-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: Frontend/.nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: jar
      - name: Start WireMock (fake ExerciseDB)
        run: |
          docker run -d --name wiremock -p 8089:8080 -v "$GITHUB_WORKSPACE/Tests/wiremock:/home/wiremock" wiremock/wiremock:3.9.1
          curl --retry 30 --retry-delay 1 --retry-all-errors --retry-connrefused -sf http://localhost:8089/__admin/mappings > /dev/null
      - name: Start the backend
        run: |
          nohup java -jar jar/*.jar > app.log 2>&1 &
          scripts/wait-for-health.sh http://localhost:8080 30
      - name: Create the test user
        # Confirmed in this project: POST /auth/signup with name, email and password answers 201.
        run: |
          BODY="$(jq -n --arg n 'CI User' --arg e "$TEST_USER_EMAIL" --arg p "$TEST_USER_PW" '{name:$n,email:$e,password:$p}')"
          curl -sf -X POST http://localhost:8080/auth/signup -H 'Content-Type: application/json' -d "$BODY"
      - name: Install Newman
        # Needs package-lock.json and a newman dependency in the repository root package.json.
        run: npm ci
      - name: Run Newman
        run: npm run test:api:local
      - name: Show the logs if something failed
        if: failure()
        run: |
          echo '--- backend ---'; tail -n 200 app.log || true
          echo '--- wiremock ---'; docker logs wiremock 2>&1 | tail -n 100 || true
