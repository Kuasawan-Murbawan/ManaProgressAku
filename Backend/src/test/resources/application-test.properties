# Phase 0 only: let Hibernate build the schema. Phase 3 switches this to validate.
spring.jpa.hibernate.ddl-auto=create-drop

# Fake values so no real secret is ever needed in tests.
# Generate one with: openssl rand -base64 32
security.jwt.secret-key=PASTE_THE_OUTPUT_OF_THE_COMMAND_ABOVE
security.jwt.expiration-time=3600000

# Points at nothing on purpose. Tests that need ExerciseDB use a stub (phase 3).
rapidapi.exercisedb.key=test-key
rapidapi.exercisedb.host=localhost
rapidapi.exercisedb.base-url=http://localhost:9/api/v1

logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=OFF